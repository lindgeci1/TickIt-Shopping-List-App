name: Trigger auto deployment for tickit-frontend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/tickit-frontend-AutoDeployTrigger-88d95142-5543-48dd-8ebf-1563db4bf252.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TICKITFRONTEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TICKITFRONTEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TICKITFRONTEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/mobile-app
          dockerfilePath: ${{ github.workspace }}/mobile-app/Dockerfile
          registryUrl: tickitacr.azurecr.io
          registryUsername: ${{ secrets.TICKITFRONTEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TICKITFRONTEND_REGISTRY_PASSWORD }}
          containerAppName: tickit-frontend
          resourceGroup: Tick-It
          imageToBuild: tickitacr.azurecr.io/tickit-frontend:${{ github.sha }}
          buildArguments: |
            VITE_BASE_API_URL=${{ secrets.TICKITFRONTEND_VITE_BASE_API_URL }}


