name: Trigger auto deployment for tickit-backend

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/tickit-backend-AutoDeployTrigger-d6047457-fc33-45de-8f8c-3e1b49a19cd3.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.TICKITBACKEND_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.TICKITBACKEND_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.TICKITBACKEND_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: tickitacr.azurecr.io
          registryUsername: ${{ secrets.TICKITBACKEND_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.TICKITBACKEND_REGISTRY_PASSWORD }}
          containerAppName: tickit-backend
          resourceGroup: Tick-It
          imageToBuild: tickitacr.azurecr.io/tickit-backend:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


