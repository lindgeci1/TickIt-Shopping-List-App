name: Laravel CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_DB: laravel_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: 2015
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup PHP
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, bcmath, pdo_pgsql
          ini-values: post_max_size=256M, memory_limit=512M
          coverage: none

      # 3. Install Composer dependencies
      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --optimize-autoloader

      # 4. Copy .env.testing for CI
      - name: Setup environment
        run: cp .env .env.testing

      # 5. Run migrations
      - name: Run migrations
        run: php artisan migrate --env=testing --force

      # 6. Run PHPUnit tests
      - name: Run tests
        run: php artisan test --env=testing --no-interaction --verbose
